<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    height: 100vh;
    background-color: #ffe4e1;
    overflow: hidden;
    cursor: none; /* Hides the default cursor */
  }

  .sparkle {
    position: absolute;
    width: 12px; /* Adjust size as needed */
    height: 12px; /* Adjust size as needed */
    background: url('https://codehs.com/uploads/8edec3be4b6ab1043e64cb2f7f2491ca') no-repeat center center;
    background-size: contain;
    pointer-events: none;
    animation: sparkle 0.7s forwards;
  }

  @keyframes sparkle {
    0% {
      opacity: 1;
      transform: scale(1);
    }
    100% {
      opacity: 0;
      transform: scale(1.5);
    }
  }
</style>
</head>
<body>


<script>
  document.addEventListener('click', createSparkles);

  function createSparkles(e) {
    const numSparkles = 10; // Number of sparkles per click

    for (let i = 0; i < numSparkles; i++) {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';

      // Random offset for each sparkle
      const offsetX = (Math.random() - 0.5) * 100;
      const offsetY = (Math.random() - 0.5) * 100;

      sparkle.style.left = `${e.pageX + offsetX}px`;
      sparkle.style.top = `${e.pageY + offsetY}px`;

      document.body.appendChild(sparkle);

      // Remove the sparkle after the animation ends
      sparkle.addEventListener('animationend', () => {
        sparkle.remove();
      });
    }
  }
</script>

</body>
